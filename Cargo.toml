[package]
name = "xmip-core-contract-protobuf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-contract-protobuf"
description = "Protocol Buffers content contract: sound wire format always, walked as a bound message type of a .proto file when a Location names one. A xmip-core-contract technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
stream = { workspace = true, optional = true }
# The character reader every lexer walks its text with.
codec = { workspace = true, optional = true }
# The wire format's one walk, which the protobuf shape sections by too; this
# contract holds what it finds to a schema (open-problems.md, problem 25, c).
message = { workspace = true, optional = true }

[features]
# The code and its declaration: the contract guide,
# module/core/capability/contract/doc/adding-a-contract.md.
default = ["declaration", "dep:contract", "dep:stream", "dep:codec", "dep:message"]
# The declaration alone.
declaration = []

[dev-dependencies]
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
