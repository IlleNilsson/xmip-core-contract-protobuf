[package]
name = "xmip-core-contract-protobuf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-contract-protobuf"
description = "Protocol Buffers content contract: sound wire format always, walked as a bound message type of a .proto file when a Location names one. A xmip-core-contract technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", optional = true }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main", optional = true }
# The character reader every lexer walks its text with.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The wire format's one walk, which the protobuf shape sections by too; this
# contract holds what it finds to a schema (open-problems.md, problem 25, c).
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main", optional = true }

[features]
# The technology: its code, everything it is built on, and its declaration.
# Without it the crate is its declaration alone (ADR-0064, amendments
# 2026-10-22 and 2026-11-26).
default = ["declaration", "dep:contract", "dep:stream", "dep:codec", "dep:message"]
# The declaration alone: what a Location naming this contract is configured
# with, `declaration::SETTINGS`, and the name a Validate step's `format`
# names it by, `NAME`, and none of the code — what the surfaces' library is
# to carry (open problem 48).
declaration = []

[dev-dependencies]
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { package = "xmip-core-library-file", git = "https://github.com/IlleNilsson/xmip-core-library-file", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
